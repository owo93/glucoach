[workspace]
resolver = "3"
members = ["glucoach-api", "glucoach-lib"]
exclude = ["glucoach-web"]

[workspace.package]
version = "0.0.0"
authors = ["owo93 <iztyle30@gmail.com>"]
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.103"
arc-swap = "1.9.2"
axum = { version = "0.8.9", features = ["tracing"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.4", features = ["http2", "json", "rustls"] }
serde = "1.0.228"
serde_json = "1.0.150"
sqlx = {
  version = "0.9.0",
  features = [
    "chrono",
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "uuid",
  ]
}
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.4", features = ["serde", "v4"] }
